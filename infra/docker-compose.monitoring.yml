# Опційний стек моніторингу — Prometheus + Grafana + cAdvisor
# Запуск: docker compose -f infra/docker-compose.yml -f infra/docker-compose.monitoring.yml up -d
# Grafana: https://SERVER:3001 (admin / admin — змінити при першому вході)
# Prometheus: https://SERVER:9090

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: qms-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - qms_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: qms-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - qms_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: qms-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://192.168.200.199"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - qms_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
